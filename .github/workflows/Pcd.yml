name: RDP Gaming PC

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================
      # RDP
      # ============================================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Configurando RDP..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP configurado."

      # ============================================
      # USUARIO RDP
      # ============================================
      - name: Create RDP User
        shell: powershell
        run: |
          Write-Host "Criando usuário RDP..."

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name "RDP"
          }

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "Gaming RDP User"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Usuário criado."

      # ============================================
      # WINDOWS GAMING OPTIMIZATION
      # ============================================
      - name: Optimize Windows for Gaming
        shell: powershell
        run: |
          Write-Host "Otimizando Windows para jogos..."

          # Plano de energia
          powercfg /setactive SCHEME_MIN

          # Game Mode
          New-Item `
            -Path "HKCU:\Software\Microsoft\GameBar" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\GameBar" `
            -Name "AllowAutoGameMode" `
            -Type DWord `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\GameBar" `
            -Name "AutoGameModeEnabled" `
            -Type DWord `
            -Value 1 `
            -Force

          # Desativar Game DVR
          New-Item `
            -Path "HKCU:\System\GameConfigStore" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\System\GameConfigStore" `
            -Name "GameDVR_Enabled" `
            -Type DWord `
            -Value 0 `
            -Force

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\GameDVR" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\GameDVR" `
            -Name "AppCaptureEnabled" `
            -Type DWord `
            -Value 0 `
            -Force

          # Menos efeitos visuais
          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2 `
            -Force

          # Desativar transparência
          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name "EnableTransparency" `
            -Type DWord `
            -Value 0 `
            -Force

          Write-Host "Windows otimizado."

      # ============================================
      # LIMPEZA
      # ============================================
      - name: Clean Temporary Files
        shell: powershell
        run: |
          Write-Host "Limpando arquivos temporários..."

          Remove-Item `
            "$env:TEMP\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "C:\Windows\Temp\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Limpeza concluída."

      # ============================================
      # STEAM
      # ============================================
      - name: Install Steam
        shell: powershell
        run: |
          Write-Host "Baixando Steam..."

          $steamUrl = "https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe"
          $steamInstaller = "$env:TEMP\SteamSetup.exe"

          Invoke-WebRequest `
            -Uri $steamUrl `
            -OutFile $steamInstaller

          if (-not (Test-Path $steamInstaller)) {
              Write-Error "Steam não foi baixada."
              exit 1
          }

          Write-Host "Instalando Steam..."

          $process = Start-Process `
            -FilePath $steamInstaller `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Falha ao instalar Steam. Código: $($process.ExitCode)"
              exit 1
          }

          Remove-Item $steamInstaller -Force -ErrorAction SilentlyContinue

          Write-Host "Steam instalada."

      # ============================================
      # INFORMACOES DO PC
      # ============================================
      - name: Show PC Specifications
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "         GAMING PC INFORMATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("Total: {0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB))

          Write-Host ""
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion

          Write-Host ""
          Write-Host "Discos:"
          Get-CimInstance Win32_LogicalDisk |
            Where-Object {$_.DriveType -eq 3} |
            Select-Object DeviceID,
              @{Name="SizeGB";Expression={[math]::Round($_.Size/1GB,2)}},
              @{Name="FreeGB";Expression={[math]::Round($_.FreeSpace/1GB,2)}}

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "========================================"

      # ============================================
      # TAILSCALE
      # ============================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Baixando Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          Write-Host "Tailscale instalado."

      # ============================================
      # TAILSCALE CONNECTION
      # ============================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "tailscale.exe não encontrado."
              exit 1
          }

          Write-Host "Conectando ao Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Falha no Tailscale."
              exit 1
          }

          Start-Sleep -Seconds 5

          $tsIP = (& $tailscale ip -4 2>$null).Trim()

          if (-not $tsIP) {
              Write-Error "Não foi possível obter o IP Tailscale."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ============================================
      # TESTE RDP
      # ============================================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Testando RDP..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "Porta 3389 não está acessível."
              exit 1
          }

          Write-Host "RDP funcionando."

      # ============================================
      # MOSTRAR LOGIN
      # ============================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "             GAMING RDP"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "IP:       $env:TAILSCALE_IP"
          Write-Host "PORT:     3389"
          Write-Host "USER:     $env:RDP_USERNAME"
          Write-Host "PASSWORD: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "STEAM: INSTALLED"
          Write-Host "GAME MODE: ENABLED"
          Write-Host "HIGH PERFORMANCE: ENABLED"
          Write-Host ""
          Write-Host "========================================"

      # ============================================
      # KEEP ALIVE
      # ============================================
      - name: Maintain Gaming PC
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Gaming PC ativo."
          Write-Host " Steam instalada."
          Write-Host " RDP ativo."
          Write-Host " Tailscale ativo."
          Write-Host "========================================"

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Gaming PC Active"
              Start-Sleep -Seconds 300
          }
